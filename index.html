<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cara o Cruz</title>
    <style>
        /* ESTILOS Y DISEÑO (CSS) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 20px;
        }

        /* Contenedor de la moneda 3D */
        .coin-container {
            perspective: 1000px;
            margin: 30px;
        }

        .coin {
            width: 150px;
            height: 150px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 3s ease-out;
        }

        /* Lados de la moneda */
        .side {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: absolute;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            border: 4px solid #fff;
        }

        .heads {
            background: linear-gradient(135deg, #ffd700, #ffa500);
            color: #333;
        }

        .tails {
            background: linear-gradient(135deg, #c0c0c0, #7f8c8d);
            color: #fff;
            transform: rotateY(180deg);
        }

        /* Botón */
        button {
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            color: #1e1e2e;
            background-color: #00adb5;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #00fff5;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Mensaje de resultado */
        #result {
            margin-top: 25px;
            font-size: 24px;
            font-weight: bold;
            min-height: 30px;
        }
    </style>
</head>
<body>

    <h1>Juego de Cara o Cruz</h1>

    <div class="coin-container">
        <div class="coin" id="coin">
            <div class="side heads">CARA</div>
            <div class="side tails">CRUZ</div>
        </div>
    </div>

    <button id="flip-btn">Lanzar Moneda</button>

    <div id="result"></div>

    <script>
        // LÓGICA DEL JUEGO (JavaScript)
        const coin = document.getElementById('coin');
        const flipBtn = document.getElementById('flip-btn');
        const resultText = document.getElementById('result');

        let currentRotation = 0;

        flipBtn.addEventListener('click', () => {
            // Deshabilitar el botón durante la animación
            flipBtn.disabled = true;
            resultText.textContent = "Girando...";

            // Generar resultado aleatorio: 0 es CARA, 1 es CRUZ
            const isHeads = Math.random() < 0.5;

            // Calcular rotación (mínimo 5 vueltas completas = 1800 grados para dar dramatismo)
            const extraDegrees = isHeads ? 0 : 180;
            currentRotation += 1800 + extraDegrees;

            // Aplicar la rotación a la moneda
            coin.style.transform = `rotateY(${currentRotation}deg)`;

            // Esperar a que termine la animación (3 segundos)
            setTimeout(() => {
                if (isHeads) {
                    resultText.textContent = "¡Salió CARA!";
                } else {
                    resultText.textContent = "¡Salió CRUZ!";
                }
                flipBtn.disabled = false;
            }, 3000);
        });
    </script>

</body>
</html>
